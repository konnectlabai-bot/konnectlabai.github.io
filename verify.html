<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email — KYNISKIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .c { width: 100%; max-width: 420px; padding: 40px 24px; }

    /* Logo */
    .logo { text-align: center; margin-bottom: 28px; }
    .logo img { width: 56px; height: 56px; border-radius: 14px; }
    .logo h1 { font-size: 22px; margin-top: 10px; color: #f1f5f9; }
    .logo p { font-size: 13px; color: #64748b; margin-top: 4px; }

    /* Card */
    .card {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 32px 28px;
    }

    /* Email display */
    .email-badge {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 8px;
      font-size: 14px;
      color: #3b82f6;
      font-weight: 500;
      margin: 8px 0 20px;
    }

    /* Code input boxes */
    .code-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }
    .code-box {
      width: 48px;
      height: 56px;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #f1f5f9;
      font-family: 'SF Mono', Menlo, Monaco, monospace;
      outline: none;
      caret-color: #3b82f6;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .code-box:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .code-box.filled {
      border-color: rgba(59,130,246,0.4);
    }

    /* Button */
    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      background: #3b82f6;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #2563eb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Messages */
    .msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 20px; }
    .msg.error { color: #ef4444; }
    .msg.success { color: #22c55e; }
    .msg.info { color: #94a3b8; }

    /* Footer links */
    .foot { text-align: center; margin-top: 24px; font-size: 13px; }
    .foot a { color: #64748b; text-decoration: none; }
    .foot a:hover { color: #94a3b8; }
    .foot span { color: #475569; margin: 0 8px; }

    /* Resend link */
    .resend { display: block; margin-top: 10px; font-size: 13px; color: #3b82f6; text-decoration: none; cursor: pointer; text-align: center; }
    .resend:hover { text-decoration: underline; }
    .resend.disabled { color: #475569; cursor: not-allowed; pointer-events: none; }

    /* Loading spinner */
    .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success state */
    .success-badge {
      display: none;
      width: 64px; height: 64px;
      margin: 0 auto 16px;
      background: rgba(34,197,94,0.1);
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      line-height: 1;
    }
    .success-badge.show { display: flex; }

    @media (max-width: 480px) {
      .c { padding: 24px 16px; }
      .card { padding: 24px 16px; }
      .code-box { width: 42px; height: 50px; font-size: 20px; }
      .code-row { gap: 8px; }
    }
  </style>
</head>
<body>
<div class="c">
  <div class="logo">
    <img src="https://konnectlabai.com/Logo.png" alt="Kynis">
    <h1>Verify your email</h1>
    <p>Enter the 6-digit code we sent to</p>
    <div class="email-badge" id="emailDisplay">you@example.com</div>
  </div>

  <div class="card">
    <div class="success-badge" id="successBadge">✅</div>

    <div id="formArea">
      <div class="code-row" id="codeRow">
        <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="0">
        <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="1">
        <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="2">
        <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="3">
        <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="4">
        <input type="text" class="code-box" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="5">
      </div>

      <button id="verifyBtn" onclick="verify()">Verify Email</button>

      <div class="msg" id="msg"></div>

      <a class="resend" id="resendLink" onclick="resend()">Resend code</a>
    </div>

    <div id="successArea" style="display:none;text-align:center;">
      <p style="font-size:16px;font-weight:600;color:#f1f5f9;margin-bottom:8px;">Email verified!</p>
      <p style="font-size:13px;color:#94a3b8;line-height:1.6;">Your KYNISKIS account is now active.<br>You can sign in and get started.</p>
      <button onclick="location.href='login.html'" style="margin-top:16px;">Sign In →</button>
    </div>
  </div>

  <div class="foot">
    <a href="index.html">← Back to KonnectLAB</a>
  </div>
</div>

<script>
// Get email from URL param or localStorage
var params = new URLSearchParams(window.location.search);
var email = params.get('email') || localStorage.getItem('kynis_verify_email') || '';
var token = localStorage.getItem('kynis_verify_token') || '';

if (email) {
  document.getElementById('emailDisplay').textContent = email;
  localStorage.setItem('kynis_verify_email', email);
}

// If no token yet (account created but email not sent), trigger it now
if (!token && email) {
  triggerEmail();
}

async function triggerEmail() {
  var msg = document.getElementById('msg');
  msg.className = 'msg info';
  msg.textContent = 'Sending verification email…';
  try {
    var r = await fetch('/api/join', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });
    var d = await r.json();
    if (r.ok && d.token) {
      token = d.token;
      localStorage.setItem('kynis_verify_token', token);
      msg.textContent = 'Code sent! Check your inbox.';
      msg.className = 'msg success';
    } else {
      msg.textContent = d.error || 'Failed to send email. Please try again.';
      msg.className = 'msg error';
    }
  } catch (e) {
    msg.textContent = 'Connection error. Please try again.';
    msg.className = 'msg error';
  }
}

// ===== Code Input UX =====
var boxes = document.querySelectorAll('.code-box');
var codeRow = document.getElementById('codeRow');

boxes.forEach(function(box, idx) {
  box.addEventListener('input', function(e) {
    var v = e.target.value.replace(/[^0-9]/g, '');
    e.target.value = v.slice(0, 1);
    if (v && idx < 5) boxes[idx + 1].focus();
    updateFilled();
    // Auto-submit if all 6 filled
    if (idx === 5 && v && getCode().length === 6) verify();
  });

  box.addEventListener('keydown', function(e) {
    if (e.key === 'Backspace' && !e.target.value && idx > 0) {
      boxes[idx - 1].focus();
      boxes[idx - 1].select();
    }
    if (e.key === 'ArrowLeft' && idx > 0) { boxes[idx - 1].focus(); boxes[idx - 1].select(); }
    if (e.key === 'ArrowRight' && idx < 5) { boxes[idx + 1].focus(); boxes[idx + 1].select(); }
  });

  box.addEventListener('paste', function(e) {
    e.preventDefault();
    var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '').slice(0, 6);
    for (var i = 0; i < 6; i++) {
      boxes[i].value = paste[i] || '';
    }
    updateFilled();
    if (paste.length === 6) verify();
    else boxes[Math.min(paste.length, 5)].focus();
  });
});

function updateFilled() {
  boxes.forEach(function(b) {
    b.classList.toggle('filled', b.value.length > 0);
  });
}

function getCode() {
  var c = '';
  boxes.forEach(function(b) { c += b.value; });
  return c;
}

// ===== Verify =====
async function verify() {
  var code = getCode();
  var btn = document.getElementById('verifyBtn');
  var msg = document.getElementById('msg');

  if (code.length < 6) {
    showMsg('Please enter all 6 digits.', 'error');
    return;
  }
  if (!email) {
    showMsg('No email found. Please register again.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Verifying…';
  msg.className = 'msg info';
  msg.textContent = '';

  try {
    var r = await fetch('/api/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, code: code, token: token })
    });
    var d = await r.json();

    if (r.ok) {
      // Success
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('successArea').style.display = 'block';
      document.getElementById('successBadge').classList.add('show');
      document.querySelector('.card').style.textAlign = 'center';
      localStorage.removeItem('kynis_verify_email');
      localStorage.removeItem('kynis_verify_token');
    } else {
      btn.disabled = false;
      btn.textContent = 'Verify Email';
      showMsg(d.error || 'Verification failed.', 'error');
      // Clear code on failure
      boxes.forEach(function(b) { b.value = ''; });
      updateFilled();
      boxes[0].focus();
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Verify Email';
    showMsg('Connection error. Please try again.', 'error');
  }
}

// ===== Resend =====
var resendCooldown = 0;
async function resend() {
  var link = document.getElementById('resendLink');
  if (resendCooldown > 0 || !email) return;

  link.classList.add('disabled');
  link.textContent = 'Sending…';

  try {
    var r = await fetch('/api/resend', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, token: token })
    });
    var d = await r.json();

    if (r.ok) {
      if (d.token) {
        token = d.token;
        localStorage.setItem('kynis_verify_token', token);
      }
      showMsg('Code re-sent! Check your inbox.', 'success');
      resendCooldown = 60;
      countdownResend();
    } else {
      showMsg(d.error || 'Failed to resend.', 'error');
      link.classList.remove('disabled');
      link.textContent = 'Resend code';
    }
  } catch (err) {
    showMsg('Connection error.', 'error');
    link.classList.remove('disabled');
    link.textContent = 'Resend code';
  }
}

function countdownResend() {
  var link = document.getElementById('resendLink');
  if (resendCooldown <= 0) {
    link.classList.remove('disabled');
    link.textContent = 'Resend code';
    return;
  }
  link.textContent = 'Resend in ' + resendCooldown + 's';
  resendCooldown--;
  setTimeout(countdownResend, 1000);
}

function showMsg(text, type) {
  var msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

// Focus first box on load
if (email) boxes[0].focus();
</script>
</body>
</html>
