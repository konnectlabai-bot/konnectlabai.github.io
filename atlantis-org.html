<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlantis 组织架构简介</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1117;
  --panel:#161b22;
  --panel2:#1c232d;
  --border:#30363d;
  --text:#c9d1d9;
  --muted:#8b949e;
  --blue:#58a6ff;
  --green:#238636;
  --lgreen:#3fb950;
  --gold:#d2991d;
  --red:#f85149;
  --ocean:#0e7490;
  --teal:#01796F;
  --display:'Archivo Black','Noto Sans SC',sans-serif;
  --body:'Noto Sans SC','Space Grotesk',sans-serif;
  --mono:'Space Grotesk',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body)}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(1200px 800px at 75% -10%,rgba(88,166,255,.12),transparent 60%),radial-gradient(900px 600px at 0% 110%,rgba(1,121,111,.14),transparent 55%),var(--bg)}
.slide{position:absolute;width:1920px;height:1080px;transform:scale(var(--s));opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s;pointer-events:none}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}
.slide{background:linear-gradient(180deg,#0d1117 0%,#0f141b 100%);overflow:hidden;position:absolute;border-radius:0}
/* grid texture */
.slide::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(48,54,61,.22) 1px,transparent 1px),linear-gradient(90deg,rgba(48,54,61,.22) 1px,transparent 1px);background-size:64px 64px;opacity:.35;pointer-events:none}
.slide-inner{position:relative;z-index:1;width:100%;height:100%;padding:72px 84px}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.slide.active .reveal{opacity:1;transform:none}
.slide.active .reveal:nth-child(1){transition-delay:.05s}
.slide.active .reveal:nth-child(2){transition-delay:.15s}
.slide.active .reveal:nth-child(3){transition-delay:.25s}
.slide.active .reveal:nth-child(4){transition-delay:.35s}
.slide.active .reveal:nth-child(5){transition-delay:.45s}
.slide.active .reveal:nth-child(6){transition-delay:.55s}
.slide.active .reveal:nth-child(7){transition-delay:.65s}
.slide.active .reveal:nth-child(8){transition-delay:.75s}

.kicker{font-family:var(--mono);font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:var(--blue);font-weight:500}
h1{font-family:var(--display);font-weight:400;letter-spacing:-.01em}
.eyebrow{font-size:20px;color:var(--muted)}

/* ---------- nav ---------- */
.nav{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:14px;background:rgba(22,27,34,.8);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:40px;padding:10px 18px}
.nav button{background:none;border:none;color:var(--text);font-family:var(--mono);font-size:16px;cursor:pointer;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.2s}
.nav button:hover{background:var(--panel2);color:#fff}
.dots{display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--border);cursor:pointer;transition:.3s}
.dot.active{background:var(--blue);width:26px;border-radius:5px}
.counter{font-family:var(--mono);font-size:14px;color:var(--muted);min-width:52px;text-align:center}

/* ---------- shared ---------- */
.tag{display:inline-block;font-family:var(--mono);font-size:12px;letter-spacing:.12em;padding:4px 10px;border-radius:20px;border:1px solid var(--border);color:var(--muted)}
.tag.blue{color:var(--blue);border-color:rgba(88,166,255,.4);background:rgba(88,166,255,.08)}
.tag.green{color:var(--lgreen);border-color:rgba(63,185,80,.4);background:rgba(63,185,80,.08)}
.tag.gold{color:var(--gold);border-color:rgba(210,153,29,.4);background:rgba(210,153,29,.08)}
.tag.teal{color:#2dd4bf;border-color:rgba(45,212,191,.4);background:rgba(45,212,191,.08)}

.bignum{font-family:var(--display);line-height:.9}

/* ---------- Cover ---------- */
.cover-title{font-size:132px;color:#fff}
.cover-sub{font-size:30px;color:var(--muted);font-weight:300;letter-spacing:.06em}
.cover-glow{position:absolute;right:-120px;top:-120px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.28),transparent 65%);pointer-events:none}

/* ---------- org chart ---------- */
.org-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px}
.org-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:26px 28px;position:relative;overflow:hidden}
.org-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.org-card.rev::before{background:var(--blue)}
.org-card.revops::before{background:var(--lgreen)}
.org-card.ops::before{background:var(--gold)}
.org-card.sup::before{background:var(--teal)}
.org-head{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
.org-head .n{font-family:var(--display);font-size:56px;color:#fff}
.org-head .t{font-size:24px;font-weight:700;color:#fff}
.org-head .e{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em}
.org-desc{font-size:15px;color:var(--muted);margin-bottom:16px}
.unit-list{display:flex;flex-wrap:wrap;gap:8px}
.unit{font-size:14px;padding:7px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--border);cursor:default;transition:.18s;line-height:1.25}
.unit:hover{border-color:var(--blue);transform:translateY(-2px);background:#1f2833}
.unit .lead{color:var(--blue);font-size:12px;display:block;margin-top:2px}

/* ---------- KPI ---------- */
.kpi-wrap{display:flex;gap:24px;height:100%;margin-top:20px}
.kpi-side{width:300px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding-right:6px}
.kpi-side::-webkit-scrollbar{width:5px}
.kpi-side::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.dept-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);text-align:left;padding:12px 16px;border-radius:10px;cursor:pointer;font-family:var(--body);font-size:14px;transition:.18s;line-height:1.3}
.dept-btn:hover{background:var(--panel2)}
.dept-btn.active{border-color:var(--blue);background:rgba(88,166,255,.08);color:#fff}
.dept-btn .cnt{float:right;font-family:var(--mono);color:var(--muted);font-size:12px;margin-left:8px}
.kpi-main{flex:1;overflow-y:auto;padding-right:8px}
.kpi-main::-webkit-scrollbar{width:6px}
.kpi-main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.kpi-table{width:100%;border-collapse:collapse;font-size:13px}
.kpi-table th{position:sticky;top:0;background:var(--panel);color:var(--muted);text-align:left;font-weight:600;font-size:12px;letter-spacing:.05em;padding:12px 12px;border-bottom:2px solid var(--border);z-index:2;font-family:var(--mono)}
.kpi-table td{padding:12px;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text)}
.kpi-table tr:hover td{background:rgba(88,166,255,.04)}
.kpi-name{font-weight:700;color:#fff;font-size:14px}
.kpi-lead{font-size:12px;color:var(--blue)}
.kpi-cell{max-width:280px;line-height:1.45;font-size:12.5px;color:var(--text)}
.kpi-cell.muted{color:var(--muted)}
.search{width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:12px 16px;border-radius:10px;font-family:var(--body);font-size:14px;margin-bottom:12px;outline:none}
.search:focus{border-color:var(--blue)}
.dept-stats{font-family:var(--mono);font-size:12px;color:var(--muted);margin-bottom:10px}

/* ---------- capability ---------- */
.cap-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:34px}
.cap-group{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:34px 38px}
.cap-group h3{font-family:var(--display);font-size:40px;color:#fff;margin-bottom:4px}
.cap-group .cap-en{font-family:var(--mono);font-size:13px;color:var(--blue);letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px}
.cap-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.cap-item:last-child{border-bottom:none}
.cap-num{font-family:var(--mono);font-size:13px;color:var(--gold);font-weight:700;padding-top:3px;min-width:28px}
.cap-name{font-size:19px;font-weight:700;color:#fff;min-width:96px}
.cap-def{font-size:14px;color:var(--muted);line-height:1.55;flex:1}

/* ---------- image slide ---------- */
.img-slide{display:flex;align-items:center;justify-content:center;height:100%}
.img-frame{border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);background:#fff;max-height:86%}
.img-frame img{display:block;width:100%;height:auto;max-height:820px;object-fit:contain}

@media (prefers-reduced-motion: reduce){
  .reveal{transition:none}
  .slide{transition:none}
}
</style>
</head>

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function unitChip(u){
  return '<span class="unit">'+esc(u[0])+'<span class="lead">'+esc(u[1])+'</span></span>';
}

function buildOrgSlide(){
  const cats = [
    ['rev', DATA.org.revenue],
    ['revops', DATA.org.revops],
    ['ops', DATA.org.ops],
    ['sup', DATA.org.support],
  ];
  let cards = cats.map(([k,c])=>{
    return '<div class="org-card '+k+'"><div class="org-head"><span class="n">'+c.count+'</span><span class="t">'+c.label+'</span><span class="e">'+c.en+'</span></div><div class="org-desc">'+esc(c.desc)+'</div><div class="unit-list">'+c.units.map(unitChip).join('')+'</div></div>';
  }).join('');
  return '<div class="slide-inner"><div class="reveal"><span class="kicker">Small-Unit Organization</span></div><div class="reveal"><h1 style="font-size:72px;color:#fff;margin-top:8px">基于小单元的组织架构</h1></div><div class="reveal"><div class="eyebrow" style="margin-top:10px">45 个小单元 · 6 收入 + 23 收入运营 + 9 运营 + 7 支持</div></div><div class="reveal"><div class="org-grid">'+cards+'</div></div></div>';
}

function buildDeptSlide(){
  return '<div class="slide-inner"><div class="reveal"><span class="kicker">Supporting Functions</span></div><div class="reveal"><h1 style="font-size:64px;color:#fff;margin-top:8px">支持小单元的职能部门结构</h1></div><div class="reveal"><div class="eyebrow" style="margin-top:10px;max-width:1100px">职能团队与一线小单元同样以「单元」形式组织 —— 每个单元有明确的负责人与独立 KPI，形成「前台创收 + 后台支持」的双层小单元网络。</div></div><div class="reveal" id="deptGrid" style="margin-top:30px"></div></div>';
}

function buildCapSlide(){
  let g = '';
  for (const [grp, items] of Object.entries(DATA.capability)){
    let rows = items.map((it,i)=>'<div class="cap-item"><div class="cap-num">0'+(i+1)+'</div><div class="cap-name">'+esc(it[0])+'</div><div class="cap-def">'+esc(it[1])+'</div></div>').join('');
    g += '<div class="cap-group"><h3>'+grp+'</h3><div class="cap-en">'+(grp==='认知力'?'Cognitive':'Execution')+'</div>'+rows+'</div>';
  }
  return '<div class="slide-inner"><div class="reveal"><span class="kicker">Capability Model</span></div><div class="reveal"><h1 style="font-size:68px;color:#fff;margin-top:8px">小单元负责人能力模型</h1></div><div class="reveal"><div class="eyebrow" style="margin-top:10px">8 项核心能力 · 认知力 × 执行力 双轮驱动</div></div><div class="reveal"><div class="cap-grid">'+g+'</div></div></div>';
}

function buildKpiSlide(){
  return '<div class="slide-inner" style="padding-bottom:40px"><div class="reveal"><span class="kicker">Performance · KPI</span></div><div class="reveal"><h1 style="font-size:60px;color:#fff;margin-top:6px">小单元 KPI 绩效评估</h1></div><div class="reveal"><div class="kpi-wrap"><div class="kpi-side" id="kpiSide"></div><div class="kpi-main"><input class="search" id="kpiSearch" placeholder="搜索小单元或负责人…"><div class="dept-stats" id="deptStats"></div><table class="kpi-table" id="kpiTable"></table></div></div></div></div>';
}

function buildImgSlide(){
  return '<div class="slide-inner"><div class="reveal"><span class="kicker">Conventional Structure</span></div><div class="reveal"><h1 style="font-size:60px;color:#fff;margin-top:6px">常规组织架构</h1></div><div class="reveal"><div class="img-slide"><div class="img-frame"><img src="data:image/png;base64,'+IMG+'" alt="常规组织架构"></div></div></div></div>';
}

function buildCover(){
  return '<div class="slide-inner" style="display:flex;flex-direction:column;justify-content:center"><div class="cover-glow"></div><div class="reveal"><span class="kicker">Atlantis Sanya · Organization</span></div><div class="reveal"><h1 class="cover-title" style="margin-top:20px">Atlantis</h1></div><div class="reveal"><h1 style="font-size:72px;color:var(--blue);margin-top:6px">组织架构简介</h1></div><div class="reveal"><div class="cover-sub" style="margin-top:28px">小单元化组织 · 45 个经营单元 · 能力驱动 · KPI 闭环</div></div><div class="reveal" style="margin-top:48px;display:flex;gap:12px"><span class="tag blue">Small-Unit Organization</span><span class="tag green">45 Units</span><span class="tag gold">Capability Model</span><span class="tag teal">KPI System</span></div></div>';
}

const slides = [
  {title:'封面', build: buildCover},
  {title:'组织架构', build: buildOrgSlide},
  {title:'职能部门', build: buildDeptSlide},
  {title:'能力模型', build: buildCapSlide},
  {title:'KPI 绩效', build: buildKpiSlide},
  {title:'常规架构', build: buildImgSlide},
];

const stage = document.getElementById('stage');
const dotsEl = document.getElementById('dots');
const counterEl = document.getElementById('counter');
let cur = 0;

function buildDeptGrid(){
  // group 45 units by department (derived from KPI data dept)
  const depts = {};
  DATA.org.revenue.units.forEach(u=>{ (depts['收入小单元']=depts['收入小单元']||[]).push(u) });
  DATA.org.revops.units.forEach(u=>{ (depts['收入运营小单元']=depts['收入运营小单元']||[]).push(u) });
  DATA.org.ops.units.forEach(u=>{ (depts['运营小单元']=depts['运营小单元']||[]).push(u) });
  DATA.org.support.units.forEach(u=>{ (depts['支持小单元']=depts['支持小单元']||[]).push(u) });
  const order = ['收入小单元','收入运营小单元','运营小单元','支持小单元'];
  const colors = {收入小单元:'rev',收入运营小单元:'revops',运营小单元:'ops',支持小单元:'sup'};
  let html = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:18px">';
  order.forEach(d=>{
    html += '<div class="org-card '+colors[d]+'" style="padding:20px 22px"><div class="org-head" style="align-items:center"><span class="n" style="font-size:38px">'+depts[d].length+'</span><span class="t" style="font-size:18px">'+d+'</span></div><div class="unit-list" style="margin-top:12px">'+depts[d].map(u=>'<span class="unit" style="font-size:12.5px">'+esc(u[0])+'</span>').join('')+'</div></div>';
  });
  html += '</div>';
  document.getElementById('deptGrid').innerHTML = html;
}

function buildKpi(){
  const side = document.getElementById('kpiSide');
  const table = document.getElementById('kpiTable');
  const stats = document.getElementById('deptStats');
  const search = document.getElementById('kpiSearch');
  // unique depts in order
  const deptOrder = [];
  const deptMap = {};
  DATA.kpi.forEach(u=>{
    const key = u.dept || '其他';
    if(!deptMap[key]){ deptMap[key] = {count:0, units:[]}; deptOrder.push(key); }
    deptMap[key].count++;
    deptMap[key].units.push(u);
  });
  let sideHtml = '<div class="dept-btn active" data-dept="__all__">全部小单元<span class="cnt">'+DATA.kpi.length+'</span></div>';
  deptOrder.forEach(d=>{
    sideHtml += '<div class="dept-btn" data-dept="'+esc(d)+'">'+esc(d.split(' ')[0])+'<span class="cnt">'+deptMap[d].count+'</span></div>';
  });
  side.innerHTML = sideHtml;

  let curDept = '__all__';
  function render(){
    const q = search.value.trim().toLowerCase();
    let list = DATA.kpi;
    if(curDept !== '__all__'){ list = list.filter(u=>u.dept === curDept); }
    if(q){ list = list.filter(u=> (u.name+' '+u.leader+' '+u.dept).toLowerCase().includes(q)); }
    stats.textContent = '共 ' + list.length + ' 个小单元';
    let rows = list.map(u=>{
      return '<tr><td><div class="kpi-name">'+esc(u.name)+'</div><div class="kpi-lead">'+esc(u.leader||'—')+'</div></td><td class="kpi-cell">'+esc(u.rev1||'—')+'</td><td class="kpi-cell">'+esc(u.rev2||'—')+'</td><td class="kpi-cell">'+esc(u.cost||'—')+'</td><td class="kpi-cell">'+esc(u.quality||'—')+'</td><td class="kpi-cell">'+esc(u.colleague||'—')+'</td></tr>';
    }).join('');
    table.innerHTML = '<thead><tr><th style="min-width:180px">小单元 / 负责人</th><th>收入 · 第一目标</th><th>收入 · 第二目标</th><th>利润 / 成本</th><th>质量指标</th><th>员工</th></tr></thead><tbody>'+rows+'</tbody>';
  }
  side.querySelectorAll('.dept-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      side.querySelectorAll('.dept-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      curDept = b.dataset.dept;
      render();
    });
  });
  search.addEventListener('input', render);
  render();
}

function render(){
  dotsEl.innerHTML = slides.map((_,i)=>'<div class="dot'+(i===cur?' active':'')+'" data-i="'+i+'"></div>').join('');
  counterEl.textContent = (cur+1)+' / '+slides.length;
  // build slides lazily on first render
  if(stage.children.length === 0){
    stage.innerHTML = slides.map(s=>'<section class="slide" data-i="'+slides.indexOf(s)+'">'+s.build()+'</section>').join('');
    buildDeptGrid();
    buildKpi();
  }
  stage.querySelectorAll('.slide').forEach((el,i)=>{
    el.classList.toggle('active', i===cur);
  });
  dotsEl.querySelectorAll('.dot').forEach((d,i)=>{
    d.classList.toggle('active', i===cur);
    d.onclick = ()=>go(i);
  });
}

function resize(){
  const sw = window.innerWidth / 1920;
  const sh = window.innerHeight / 1080;
  const s = Math.min(sw, sh);
  document.documentElement.style.setProperty('--s', s);
  stage.querySelectorAll('.slide').forEach(el=>{
    el.style.transform = 'scale('+s+')';
  });
}

function go(i){
  cur = (i + slides.length) % slides.length;
  render();
}

document.getElementById('prev').onclick = ()=>go(cur-1);
document.getElementById('next').onclick = ()=>go(cur+1);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); go(cur+1); }
  if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); go(cur-1); }
  if(e.key==='Home'){ go(0); }
  if(e.key==='End'){ go(slides.length-1); }
});

window.addEventListener('resize', resize);
render();
resize();
</script>
</body>
</html>
