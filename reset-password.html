<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — KYNISKIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .c { width: 100%; max-width: 420px; padding: 40px 24px; }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo img { width: 56px; height: 56px; border-radius: 14px; }
    .logo h1 { font-size: 22px; margin-top: 10px; color: #f1f5f9; }
    .logo p { font-size: 13px; color: #64748b; margin-top: 4px; }
    .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 28px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; margin-top: 16px; }
    label:first-child { margin-top: 0; }
    input { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #e2e8f0; font-size: 14px; outline: none; }
    input:focus { border-color: #3b82f6; }
    button { width: 100%; margin-top: 20px; padding: 13px; background: #3b82f6; border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #2563eb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 20px; }
    .msg.error { color: #ef4444; }
    .msg.success { color: #22c55e; }
    .msg.info { color: #94a3b8; }
    .back { text-align: center; margin-top: 20px; }
    .back a { color: #64748b; font-size: 13px; text-decoration: none; }
    .back a:hover { color: #94a3b8; }
  </style>
</head>
<body>
<div class="c">
  <div class="logo">
    <img src="https://konnectlabai.com/Logo.png" alt="Kynis">
    <h1>Reset your password</h1>
    <p>Enter your email and we'll send you a reset link</p>
  </div>
  <div class="card">
    <form onsubmit="return handleReset(event)">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
      <button type="submit" id="btn">Send Reset Link</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <div class="back"><a href="login.html">← Back to Sign In</a></div>
</div>

<script>
var SUPABASE_URL = 'https://glrafplaeyxckbxogbgg.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdscmFmcGxhZXl4Y2tieG9nYmdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDMyMzEsImV4cCI6MjA5NTg3OTIzMX0.qJifgfF_k4ozsLS53xPqjzjBR8I-nL5qFOHidCE37sU';

async function handleReset(e){
  e.preventDefault();
  var btn=document.getElementById('btn'),msg=document.getElementById('msg');
  btn.disabled=true;btn.textContent='Sending…';msg.innerHTML='';

  try{
    var r=await fetch(SUPABASE_URL+'/auth/v1/recover',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY},
      body:JSON.stringify({
        email:document.getElementById('email').value.trim(),
        redirect_to: 'https://www.konnectlabai.com/update-password.html'
      })
    });

    // Supabase always returns success for security (doesn't reveal if email exists)
    msg.innerHTML='<span class="success">✓ If that email is registered, check your inbox for the reset link.</span>';
    btn.textContent='Sent!';
    setTimeout(function(){ btn.textContent='Send Reset Link'; btn.disabled=false; },3000);
  }catch(err){
    msg.innerHTML='<span class="error">Something went wrong. Please try again.</span>';
    btn.disabled=false;btn.textContent='Send Reset Link';
  }
  return false;
}
</script>
</body>
</html>
