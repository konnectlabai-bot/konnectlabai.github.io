<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — KYNISKIS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .c { width: 100%; max-width: 420px; padding: 40px 24px; }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo img { width: 56px; height: 56px; border-radius: 14px; }
    .logo h1 { font-size: 22px; margin-top: 10px; color: #f1f5f9; }
    .logo p { font-size: 13px; color: #64748b; margin-top: 4px; }
    .card { background: #1e293b; border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 28px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; margin-top: 14px; }
    label:first-child { margin-top: 0; }
    input { width: 100%; padding: 12px 14px; background: #0f172a; border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; color: #e2e8f0; font-size: 14px; outline: none; }
    input:focus { border-color: #3b82f6; }
    .pw-bar { height:3px; background:#1e293b; border-radius:2px; margin-top:6px; overflow:hidden; }
    .pw-fill { height:100%; width:0%; border-radius:2px; transition:width 0.3s,background 0.3s; }
    button { width: 100%; margin-top: 20px; padding: 13px; background: #3b82f6; border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:hover { background: #2563eb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { font-size: 13px; margin-top: 14px; text-align: center; min-height: 20px; }
    .msg.error { color: #ef4444; }
    .msg.success { color: #22c55e; }
    .msg.info { color: #94a3b8; }
    .back { text-align: center; margin-top: 20px; }
    .back a { color: #64748b; font-size: 13px; text-decoration: none; }
    .back a:hover { color: #94a3b8; }
  </style>
</head>
<body>
<div class="c">
  <div class="logo">
    <img src="https://konnectlabai.com/Logo.png" alt="Kynis">
    <h1>Set a new password</h1>
    <p>Choose something you'll remember</p>
  </div>
  <div class="card">
    <form onsubmit="return handleUpdate(event)">
      <label>New Password</label>
      <input type="password" id="password" placeholder="Min 8 characters" required minlength="8" oninput="checkPw()">
      <div class="pw-bar"><div class="pw-fill" id="pwStr"></div></div>
      <div style="font-size:11px;color:#64748b;margin-top:4px;" id="pwHint">Use 8+ characters with letters, numbers &amp; symbols</div>
      <button type="submit" id="btn">Update Password</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <div class="back"><a href="login.html">← Back to Sign In</a></div>
</div>

<script>
var SUPABASE_URL = 'https://glrafplaeyxckbxogbgg.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdscmFmcGxhZXl4Y2tieG9nYmdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzMDMyMzEsImV4cCI6MjA5NTg3OTIzMX0.qJifgfF_k4ozsLS53xPqjzjBR8I-nL5qFOHidCE37sU';

function checkPw(){
  var pw=document.getElementById('password').value,s=0;
  if(pw.length>=8)s++;if(pw.length>=12)s++;
  if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^a-zA-Z0-9]/.test(pw))s++;
  var b=document.getElementById('pwStr'),h=document.getElementById('pwHint'),p=s*20;
  b.style.width=p+'%';
  if(s<=1){b.style.background='#ef4444';h.textContent='Too weak — add more variety';}
  else if(s<=2){b.style.background='#f59e0b';h.textContent='Getting there — add numbers or symbols';}
  else if(s<=3){b.style.background='#3b82f6';h.textContent='Decent — make it longer';}
  else{b.style.background='#22c55e';h.textContent='Strong password ✓';}
}

async function handleUpdate(e){
  e.preventDefault();
  var btn=document.getElementById('btn'),msg=document.getElementById('msg');
  btn.disabled=true;btn.textContent='Updating…';msg.innerHTML='';

  try{
    // Supabase puts the recovery token in the URL hash (#access_token=xxx)
    var hash = window.location.hash.substring(1);
    var params = new URLSearchParams(hash);
    var accessToken = params.get('access_token');
    var type = params.get('type');

    if (!accessToken || type !== 'recovery') {
      msg.innerHTML='<span class="error">Invalid or expired reset link. Please request a new one.</span>';
      btn.disabled=false;btn.textContent='Update Password';
      return false;
    }

    var r=await fetch(SUPABASE_URL+'/auth/v1/user',{
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'apikey':SUPABASE_ANON_KEY,
        'Authorization':'Bearer '+accessToken
      },
      body:JSON.stringify({
        password:document.getElementById('password').value
      })
    });

    if(!r.ok){var d=await r.json();throw new Error(d.msg||d.error||'Failed to update password');}

    msg.innerHTML='<span class="success">✓ Password updated! Redirecting to sign in…</span>';
    btn.textContent='Done!';
    setTimeout(function(){ location.href='login.html'; },2000);
  }catch(err){
    msg.innerHTML='<span class="error">'+err.message+'</span>';
    btn.disabled=false;btn.textContent='Update Password';
  }
  return false;
}
</script>
</body>
</html>
